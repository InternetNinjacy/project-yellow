name: Project Yellow SGB Bulbasaur isolated capture
on:
  pull_request:
  workflow_dispatch:
jobs:
  sgb-bulbasaur:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gbdev/rgbds
          ref: v1.0.3
          path: .toolchain/rgbds
      - uses: actions/checkout@v4
        with:
          repository: LIJI32/SameBoy
          ref: v1.0.3
          path: .toolchain/sameboy
      - name: Syntax-check SGB navigation fixture
        run: python -m py_compile scripts/yel_test_004_sgb_navigate.py scripts/yel_test_004_sgb_debug_probe.py
      - name: Install SGB emulator and virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libpng-dev pkg-config build-essential xvfb xdotool imagemagick libsdl2-dev
          python -m pip install pyboy Pillow
      - name: Build RGBDS
        working-directory: .toolchain/rgbds
        run: sudo make -j2 install
      - name: Build pinned SameBoy SGB-capable emulator
        run: make -C .toolchain/sameboy -j2 sdl CONF=release
      - name: Compile isolated DEBUG ROM
        run: |
          # Keep the SameBoy build; deleting .toolchain would remove the emulator.
          # CI-only sprite station swap; release game files are untouched.
          sed -i 's/SPRITE_IVYSAUR/SPRITE_BULBASAUR/g' data/maps/objects/RedsHouse1F.asm
          make -j2 pokeyellow_debug.gbc
          mkdir -p test-results/sgb-smoke
          sha256sum pokeyellow_debug.gbc > test-results/sgb-smoke/rom.sha256
      - name: Generate independent Red House 1F visual reference
        run: |
          python scripts/yel_test_004_gbc_bulbasaur.py --cgb --rom pokeyellow_debug.gbc --sym pokeyellow_debug.sym --sprite-2bpp gfx/sprites/bulbasaur.2bpp --out test-results/sgb-reference
          test -s test-results/sgb-reference/lab_entry.png
      - name: Probe actual SGB map and coordinates through SameBoy debugger
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' python scripts/yel_test_004_sgb_debug_probe.py \
            --emulator .toolchain/sameboy/build/bin/SDL/sameboy \
            --rom pokeyellow_debug.gbc --sym pokeyellow_debug.sym \
            --out test-results/sgb-debugger
      - name: Launch genuine SGB model in headless X server
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1024x768x24' bash -euxo pipefail -c '
            export SDL_AUDIODRIVER=dummy
            mkfifo test-results/sgb-smoke/debug_commands.fifo
            exec 3<>test-results/sgb-smoke/debug_commands.fifo
            .toolchain/sameboy/build/bin/SDL/sameboy --nogl --model sgb-ntsc pokeyellow_debug.gbc <test-results/sgb-smoke/debug_commands.fifo >test-results/sgb-smoke/sameboy.log 2>&1 &
            pid=$!
            sleep 65
            wid=$(xdotool search --name "SameBoy" | head -1)
            test -n "$wid"
            xdotool windowactivate --sync "$wid" || true
            import -window "$wid" test-results/sgb-smoke/sgb_title.png
            xdotool keydown --window "$wid" BackSpace
            sleep 0.35
            xdotool keyup --window "$wid" BackSpace
            sleep 4
            import -window "$wid" test-results/sgb-smoke/sgb_select.png
            xdotool keydown --window "$wid" Down
            sleep 0.4
            xdotool keyup --window "$wid" Down
            sleep 2
            import -window "$wid" test-results/sgb-smoke/sgb_debug_selected.png
            xdotool keydown --window "$wid" x
            sleep 0.4
            xdotool keyup --window "$wid" x
            sleep 5
            import -window "$wid" test-results/sgb-smoke/sgb_intro.png
            for n in $(seq 1 28); do
              xdotool keydown --window "$wid" x
              sleep 0.25
              xdotool keyup --window "$wid" x
              sleep 0.75
            done
            import -window "$wid" test-results/sgb-smoke/sgb_after_intro.png
            xdotool keydown --window "$wid" Up
            sleep 0.6
            xdotool keyup --window "$wid" Up
            sleep 6
            import -window "$wid" test-results/sgb-smoke/sgb_lab_attempt.png
            # Capture the sprite BEFORE further movement can leave map $25.
            import -window "$wid" test-results/sgb-smoke/bulbasaur_map25_candidate.png
            kill -INT "$pid"
            sleep 2
            printf "print [wCurMap]\\nprint [wXCoord]\\nprint [wYCoord]\\ncontinue\\n" >&3
            sleep 2
            # No further navigation: the old step accidentally walked from $25 into $26.
            # Preserve the confirmed downstairs frame for a map-gated capture.
            kill -INT "$pid"
            sleep 2
            printf "print [wCurMap]\\nprint [wXCoord]\\nprint [wYCoord]\\ncontinue\\n" >&3
            sleep 3
            grep -E "SameBoy|[0-9]|CurMap|Coord" test-results/sgb-smoke/sameboy.log | tail -45 || true
            # Native SameBoy debugger reads; stop the CPU before capturing VRAM/OAM.
            # These dumps are NOT screenshots and must be validated independently.
            kill -INT "$pid"
            sleep 2
            shadow_addr=$(awk '"'"'$2=="wShadowOAM" {split($1,a,":"); print "$"a[2]; exit}'"'"' pokeyellow_debug.sym)
            test -n "$shadow_addr"
            printf "examine/6144 \$8000\nexamine/160 \$fe00\nexamine/160 %s\n" "$shadow_addr" >&3
            sleep 6
            # The live debugger is paused after the VRAM/OAM dump.
            # Sample independently rendered SGB frames with matching WRAM
            # directions/step statuses. Do not substitute GBC screenshots.
            mkdir -p test-results/sgb-smoke/directions
            map_addr=$(awk '"'"'$2=="wCurMap" {split($1,a,":"); print a[2]; exit}'"'"' pokeyellow_debug.sym)
            state1=$(awk '"'"'$2=="wSprite01StateData1" {split($1,a,":"); print a[2]; exit}'"'"' pokeyellow_debug.sym)
            state2=$(awk '"'"'$2=="wSprite01StateData2" {split($1,a,":"); print a[2]; exit}'"'"' pokeyellow_debug.sym)
            test -n "$map_addr" && test -n "$state1" && test -n "$state2"
            facing_addr=$(printf "%04x" $((16#$state1 + 9)))
            status_addr=$(printf "%04x" $((16#$state1 + 1)))
            xpos_addr=$(printf "%04x" $((16#$state2 + 4)))
            ypos_addr=$(printf "%04x" $((16#$state2 + 5)))
            printf "continue\n" >&3
            sleep 1
            for i in $(seq 0 119); do
              import -window "$wid" "test-results/sgb-smoke/directions/direction_$(printf %02d "$i").png"
              kill -INT "$pid"
              sleep 0.22
              printf "examine/1 \$%s\nexamine/1 \$%s\nexamine/1 \$%s\nexamine/1 \$%s\nexamine/1 \$%s\n" \
                "$map_addr" "$facing_addr" "$status_addr" "$xpos_addr" "$ypos_addr" >&3
              if (( i % 8 == 0 )); then
                printf "examine/160 \\$fe00\\nexamine/160 %s\\n" "$shadow_addr" >&3
                sleep 0.65
              else
                sleep 0.32
              fi
              printf "continue\\n" >&3
              sleep 0.55
            done
            sleep 2
            # Controlled SGB-NTSC layer test, original SGB model and release art.
            # Write only the LCD OBJ enable bit through SameBoy debugger.
            kill -INT "$pid"
            sleep 0.3
            sleep 0.3
            printf "print [\$ff40] = ([\$ff40] & \$fd)\ncontinue\n" >&3
            sleep 1.2
            import -window "$wid" test-results/sgb-smoke/obj_disabled.png
            kill -INT "$pid"
            sleep 0.3
            printf "print [\$ff40] = ([\$ff40] | \$02)\ncontinue\n" >&3
            sleep 1.1
            import -window "$wid" test-results/sgb-smoke/obj_reenabled.png
            kill $pid || true
            wait $pid || true
          '
          test -s test-results/sgb-smoke/sameboy.log
          python scripts/yel_test_004_sgb_capture_gate.py --species Bulbasaur --log test-results/sgb-smoke/sameboy.log --frame test-results/sgb-smoke/bulbasaur_map25_candidate.png --reference test-results/sgb-reference/lab_entry.png --out test-results/sgb-smoke/bulbasaur_capture_report.json
      - name: Verify Bulbasaur SGB border and viewport
        run: |
          python scripts/yel_test_004_sgb_border_gate.py \
            --species Bulbasaur \
            --frame test-results/sgb-smoke/bulbasaur_map25_candidate.png \
            --out test-results/sgb-smoke/bulbasaur_border_report.json
      - name: Verify live SGB VRAM and OAM for Bulbasaur
        run: |
          python scripts/yel_test_004_sgb_live_integrity.py \
            --species Bulbasaur \
            --sym pokeyellow_debug.sym \
            --sprite-2bpp gfx/sprites/bulbasaur.2bpp \
            --transcript test-results/sgb-smoke/sameboy.log \
            --out test-results/sgb-smoke/bulbasaur_live_integrity.json
      - name: Verify independent live SGB directions and walking for Bulbasaur
        run: |
          python scripts/yel_test_004_sgb_direction_gate.py \
            --species Bulbasaur \
            --log test-results/sgb-smoke/sameboy.log \
            --frames test-results/sgb-smoke/directions \
            --sym pokeyellow_debug.sym \
            --out test-results/sgb-smoke/bulbasaur_direction_report.json
      - name: Evaluate SGB OBJ background compositing for Bulbasaur
        run: |
          python scripts/yel_test_004_sgb_compositing.py \
            --species Bulbasaur \
            --enabled test-results/sgb-smoke/obj_reenabled.png \
            --disabled test-results/sgb-smoke/obj_disabled.png \
            --out test-results/sgb-smoke/bulbasaur_compositing.json
      - name: Audit distinct approved 2bpp sprite source assets
        run: |
          python scripts/yel_test_004_sgb_source_integrity.py \
            --bulbasaur gfx/sprites/bulbasaur.2bpp \
            --ivysaur gfx/sprites/ivysaur.2bpp \
            --out test-results/sgb-smoke/source_integrity.json
      - name: Archive actual SGB emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yel-test-004-sgb-bulbasaur-map25
          path: |
            test-results/sgb-smoke/
            test-results/sgb-reference/lab_entry.png
            test-results/sgb-debugger/
          if-no-files-found: warn
