name: Project Yellow dev lab build
on:
  push:
    branches: [yel-test-003-dev-lab]
  pull_request:
  workflow_dispatch:
jobs:
  dev-lab-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gbdev/rgbds
          ref: v1.0.3
          path: .toolchain/rgbds
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libpng-dev pkg-config build-essential
          python -m pip install pyboy Pillow
      - name: Build RGBDS
        working-directory: .toolchain/rgbds
        run: sudo make -j2 install
      - name: Compile release and DEBUG variants
        run: |
          rm -rf .toolchain
          make -j2 pokeyellow.gbc pokeyellow_debug.gbc
          sha256sum pokeyellow.gbc pokeyellow_debug.gbc | tee test-results-rom-sha256.txt
      - name: Boot DEBUG ROM in headless DMG mode
        run: python scripts/yel_emulator_smoke.py --rom pokeyellow_debug.gbc --out test-results/dev-lab-boot
      - name: Verify real Ivysaur lab rendering
        run: |
          python scripts/yel_dev_lab_verify_ivysaur.py \
            --rom pokeyellow_debug.gbc \
            --sym pokeyellow_debug.sym \
            --sprite-2bpp gfx/sprites/ivysaur.2bpp \
            --out test-results/dev-lab-ivysaur
      - name: Archive evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yel-test-003-dev-lab-build-visual-evidence
          path: |
            test-results/dev-lab-boot/
            test-results/dev-lab-ivysaur/
            test-results-rom-sha256.txt
          if-no-files-found: warn
