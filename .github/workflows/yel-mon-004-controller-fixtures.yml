name: YEL-MON-004 DEBUG Controller Fixture Probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/battle/probe_debug_controller_startup.py'
      - 'tests/battle/probe_rat_debug_fight.py'
      - 'tests/battle/capture_rat_move_outcomes.py'
      - 'tests/battle/test_rat_move_replay.py'
      - 'tests/battle/check_rattaking_evolution_contract.py'
      - 'tests/battle/probe_rattaking_overworld_route.py'
      - 'tests/battle/probe_rattaking_route1_encounter.py'
      - 'tests/battle/probe_rattaking_evolution_battle.py'
      - 'tests/battle/probe_rattaking_save_continue.py'
      - '.github/workflows/yel-mon-004-controller-fixtures.yml'
jobs:
  debug-controller-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libpng-dev pkg-config
          git clone --depth 1 --branch v1.0.3 https://github.com/gbdev/rgbds.git _rgbds
          sudo make -C _rgbds -j2 install
          python -m pip install 'pyboy>=2,<3' pillow
      - name: Build DEBUG ROM with symbols
        run: make -j2 pokeyellow_debug.gbc
      - name: Check probe syntax
        run: python -m py_compile tests/battle/probe_debug_controller_startup.py tests/battle/probe_rat_debug_fight.py tests/battle/capture_rat_move_outcomes.py tests/battle/test_rat_move_replay.py tests/battle/probe_rattaking_overworld_route.py tests/battle/probe_rattaking_route1_encounter.py tests/battle/probe_rattaking_evolution_battle.py tests/battle/probe_rattaking_save_continue.py
      - name: Verify Rattaking evolution source contract
        run: python tests/battle/check_rattaking_evolution_contract.py
      - name: Capture controller-only DEBUG startup diagnostics
        run: |
          mkdir -p artifacts/rat-debug-startup
          python tests/battle/probe_debug_controller_startup.py \
            --rom pokeyellow_debug.gbc \
            --symbols pokeyellow_debug.sym \
            --output artifacts/rat-debug-startup
      - name: Find legitimate overworld route for Raticate experience fixture
        continue-on-error: true
        run: |
          mkdir -p artifacts/rat-evolution-route
          python tests/battle/probe_rattaking_overworld_route.py \
            --rom pokeyellow_debug.gbc \
            --symbols pokeyellow_debug.sym \
            --initial-state artifacts/rat-debug-startup/debug_startup_final.state \
            --initial-trace artifacts/rat-debug-startup/debug_startup_inputs.json \
            --output artifacts/rat-evolution-route
      - name: Capture real Route 1 wild battle with level-35 Raticate
        continue-on-error: true
        run: |
          mkdir -p artifacts/rat-route1-encounter
          python tests/battle/probe_rattaking_route1_encounter.py \
            --rom pokeyellow_debug.gbc \
            --symbols pokeyellow_debug.sym \
            --starting-state artifacts/rat-evolution-route/overworld_route_found.state \
            --starting-trace artifacts/rat-evolution-route/overworld_route_trace.json \
            --output artifacts/rat-route1-encounter
      - name: Switch level-35 Raticate into actual wild battle
        continue-on-error: true
        run: |
          mkdir -p artifacts/rat-evolution-battle
          python tests/battle/probe_rattaking_evolution_battle.py \
            --rom pokeyellow_debug.gbc \
            --symbols pokeyellow_debug.sym \
            --initial-state artifacts/rat-route1-encounter/route1_wild_encounter.state \
            --initial-trace artifacts/rat-route1-encounter/route1_wild_encounter_trace.json \
            --output artifacts/rat-evolution-battle
      - name: In-game SAVE and fresh CONTINUE record comparison
        continue-on-error: true
        run: |
          mkdir -p artifacts/rat-persistence
          python tests/battle/probe_rattaking_save_continue.py \
            --rom pokeyellow_debug.gbc \
            --symbols pokeyellow_debug.sym \
            --evolved-state artifacts/rat-evolution-battle/rattaking_evolved.state \
            --evolved-trace artifacts/rat-evolution-battle/evolution_battle_trace.json \
            --output artifacts/rat-persistence
      - name: Probe real DEBUG Fight menu with controller only
        run: |
          mkdir -p artifacts/rat-debug-fight
          python tests/battle/probe_rat_debug_fight.py \
            --rom pokeyellow_debug.gbc \
            --symbols pokeyellow_debug.sym \
            --output artifacts/rat-debug-fight
      - name: Capture all four legitimate Poison Fang and Crunch outcomes
        run: |
          mkdir -p artifacts/rat-move-fixtures
          python tests/battle/capture_rat_move_outcomes.py \
            --rom pokeyellow_debug.gbc \
            --symbols pokeyellow_debug.sym \
            --starting-state artifacts/rat-debug-fight/debug_fight_pre_action.state \
            --starting-trace artifacts/rat-debug-fight/debug_fight_pre_action_trace.json \
            --output artifacts/rat-move-fixtures
      - name: Require actual Route 1 or battle transition
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("artifacts/rat-evolution-route/route_search.json")
          assert path.exists(), "Missing overworld route evidence"
          record=json.loads(path.read_text())
          found=record.get("found")
          assert found and (found.get("wIsInBattle") or found.get("wCurMap") == 12), "No actual controller-driven map transition"
          PY
      - name: Require actual Route 1 wild encounter
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("artifacts/rat-route1-encounter/route1_encounter_search.json")
          assert f.exists(), "Missing wild encounter search evidence"
          o=json.loads(f.read_text())
          e=o.get("encounter")
          assert e and e["wCurMap"]==12 and e["wIsInBattle"]==1 and e["wEnemyMonSpecies"], "No verified wild encounter on Route 1"
          PY
      - name: Require verified Rattaking evolution and genuine SAVE CONTINUE
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evolved=Path("artifacts/rat-evolution-battle/rattaking_evolved.state")
          assert evolved.is_file() and evolved.stat().st_size>10000, "No genuine level-36 Rattaking evolution state"
          marker=Path("artifacts/rat-persistence/persistence_gate_passed.json")
          assert marker.is_file(), "Real in-game SAVE and fresh CONTINUE not verified"
          data=json.loads(marker.read_text())
          assert data.get("passed") is True, "Persistence comparison failed"
          PY
      - name: Preserve evidence on both success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yel-mon-004-debug-startup-controller-evidence
          path: |
            artifacts/
            pokeyellow_debug.sym
          if-no-files-found: warn
