name: CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  rgbds_version: v1.0.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rgbds
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          sudo make -j$(nproc) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Compare
        if: ${{ github.repository_owner == 'pret' }}
        run: |
          make DEBUG=1 -j$(nproc) compare
          .github/checkdiff.sh

      - name: Make
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -j$(nproc)
          .github/checkdiff.sh

      - name: YEL-QOL-012 storage transaction contract tests
        run: |
          python3 -m unittest discover -s tests -p 'test_yel_qol_012_storage_layout.py' -v
          python3 -m unittest discover -s tests -p 'test_yel_qol_012_records.py' -v
          python3 -m unittest discover -s tests -p 'test_yel_qol_012_transactions.py' -v
          python3 -m unittest discover -s tests -p 'test_yel_qol_012_fixture.py' -v

      - name: YEL-QOL-012 isolated real-emulator assembly transactions
        run: |
          python3 -m pip install 'pyboy==2.6.0'
          mkdir -p test-results/yel-qol-012
          python3 scripts/yel_qol_012_cpu_probe.py --rom pokeyellow_debug.gbc --sym pokeyellow_debug.sym --out test-results/yel-qol-012/cpu-transaction.json

      - name: YEL-QOL-012 real capture and SAVE/CONTINUE replay
        if: ${{ hashFiles('tests/replays/yel_qol_012_full_party_29_to_30.json') != '' }}
        run: |
          mkdir -p test-results/yel-qol-012
          python3 scripts/yel_qol_012_gameplay_replay.py \
            --rom pokeyellow_debug.gbc \
            --sym pokeyellow_debug.sym \
            --replay tests/replays/yel_qol_012_full_party_29_to_30.json \
            --out test-results/yel-qol-012/real-gameplay.json

      - name: Archive allowlisted YEL-QOL-012 gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yel-qol-012-gameplay-evidence
          path: test-results/yel-qol-012/real-gameplay.json
          if-no-files-found: ignore
          retention-days: 30

      - name: YEL-QOL-012 discover actual DEBUG boot inputs
        run: |
          mkdir -p test-results/yel-qol-012
          python3 scripts/yel_qol_012_discover_debug_boot.py \
            --rom pokeyellow_debug.gbc \
            --sym pokeyellow_debug.sym \
            --out test-results/yel-qol-012/debug-boot-controller.json

      - name: Archive DEBUG boot controller trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yel-qol-012-debug-controller-trace
          path: test-results/yel-qol-012/debug-boot-controller.json
          if-no-files-found: warn
          retention-days: 30

      - name: Archive allowlisted YEL-QOL-012 CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yel-qol-012-cpu-evidence
          path: test-results/yel-qol-012/cpu-transaction.json
          if-no-files-found: warn
          retention-days: 30

      - name: Discord webhook
        if: ${{ github.event_name == 'push' && github.repository_owner == 'pret' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          .github/webhook.sh

      - name: Checkout symbols
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        uses: actions/checkout@v7
        with:
          path: symbols
          ref: symbols

      - name: Move symbols
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        run: |
          cp -v *.sym *.map symbols/

      - name: Update symbols
        if: ${{ github.repository_owner == 'pret' && github.event_name == 'push' }}
        uses: EndBug/add-and-commit@v10
        with:
          cwd: "./symbols"
          add: "*.sym *.map"
          message: ${{ github.event.commits[0].message }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout rgbds
        uses: actions/checkout@v7
        with:
          path: rgbds
          ref: ${{ env.rgbds_version }}
          repository: gbdev/rgbds

      - name: Install rgbds
        working-directory: rgbds
        run: |
          brew install bison libpng pkg-config
          export PATH="$(brew --prefix bison)/bin:$PATH"
          sudo make -j$(sysctl -n hw.ncpu) install

      - name: Remove rgbds
        run: |
          rm -rf rgbds

      - name: Compare
        if: ${{ github.repository_owner == 'pret' }}
        run: |
          make DEBUG=1 -j$(sysctl -n hw.ncpu) compare
          .github/checkdiff.sh

      - name: Make
        if: ${{ github.repository_owner != 'pret' }}
        run: |
          make -j$(sysctl -n hw.ncpu)
          .github/checkdiff.sh
